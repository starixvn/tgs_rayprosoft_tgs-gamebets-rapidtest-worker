apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gamebets-rapidtest-worker.name" . }}
  namespace: {{ .Values.namespace }}
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Warning",
          "Tgs.GameBets.RapidTest.Worker.Messages.GameBetsRapidTestWorkerMessageHandler": "Warning"
        }
      },
      "GameBetsRapidTestWorkerConnectionStrings": {
        "GameBetsRapidTestClientBaseUrl": "http://game-gamebets-rapidtest/",
        "GameBetsClientBaseUrl": "http://game-gamebets/",
        "GameRoundsClientBaseUrl": "http://game-gamerounds/"
      }
    }
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:

    processors:
      batch:

    exporters:
      otlp:
        endpoint: "$NODE_IP:4317"
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "tgs"

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces: 
          receivers: [otlp]
          processors:
            - batch
          exporters: [otlp]
        metrics:
          receivers: [otlp]
          exporters: [prometheus]