include:
  - project: rayprosoft/tgs-ci-scripts
    ref: main
    file: GitLab/Templates/gitlab-job-templates.yml

variables:
  ImageName: pgtgs/game-gamebets-rapidtest-worker
  TgsSettingKey: game-gamebets-rapidtest-worker
  HelmTemplateFolderName: game-gamebets-rapidtest-worker
  BuildCacheKey: Tgs.GameBets.RapidTest.Worker.$CI_PIPELINE_IID

stages:
  - build
  - test
  - publish
  - deploy-dev
  - deploy-staging
  - deploy-prod

build-code:
  extends: .build-code-template

unit-test:
  extends: .unit-test-template
  script:
    - dotnet test "**/bin/$BuildConfiguration/$Framework/*Test.dll" -l:'junit;LogFilePath=TestResults/TestResults.xml'

push-nuget:
  extends: .push-nuget-template
  script:
    - push_package "Tgs.GameBets.RapidTest.Worker.Client"
  artifacts:
    paths:
      - Tgs.GameBets.RapidTest.Worker.Client/bin/$BuildConfiguration/*.nupkg

push-docker-image:
  extends: .push-docker-image-template
  script:
    - push_docker "Tgs.GameBets.RapidTest.Worker" $ImageName $Tag

push-k8s-template:
  extends: .push-k8s-template
  script:
    - push_k8s_template $HelmTemplateFolderName $ImageName $Tag

deploy-dev:
  extends: .deploy-k8s-template
  image: 
    name: pgtgs/tgs-backend-deploy:latest
  variables:
    namespace: dev
    replica: 1
    DedicatedKey: dedicated_gamewagers
    NodeSelectorKey: node-selector_gamewagers
  environment:
    name: service-dev
  stage: deploy-dev
  tags:
    - dev
    - kubernetes
    - deploy
  needs:
    - push-docker-image
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: manual
  script:
    - deploy_k8s $TgsSettingKey $HelmTemplateFolderName $namespace

deploy-staging:
  extends: .deploy-k8s-template
  image: 
    name: pgtgs/tgs-backend-deploy:latest
  variables:
    namespace: staging
    replica: 1
    DedicatedKey: dedicated_gamewagers
    NodeSelectorKey: node-selector_gamewagers
  environment:
    name: service-staging
  stage: deploy-staging
  tags:
    - staging
    - kubernetes
    - deploy
  needs:
    - push-docker-image
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: manual
  script:
    - deploy_k8s $TgsSettingKey $HelmTemplateFolderName $namespace

deploy-prod:
  extends: .deploy-k8s-template
  image: 
    name: pgtgs/tgs-backend-deploy:latest
  variables:
    namespace: prod
    replica: 2
    DedicatedKey: dedicated_gamewagers
    NodeSelectorKey: node-selector_gamewagers
  environment:
    name: service-prod
  stage: deploy-prod
  tags:
    - prod
    - kubernetes
    - deploy
  needs:
    - deploy-staging
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: manual
  script:
    - deploy_k8s $TgsSettingKey $HelmTemplateFolderName $namespace
